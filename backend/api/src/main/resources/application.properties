spring.application.name=outgo
# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/outgo
spring.datasource.username=outgo
spring.datasource.password=outgo_dev
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false

# JPA
spring.jpa.hibernate.ddl-auto=validate
# show-sql=false keeps the logs clean in dev; set to true temporarily if you need to debug a query.
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Server
server.port=8080